name: Baseline existing migrations (one-time)

# Run this ONCE, manually, before the first real migration deploy.
#
# Migrations 0001-0009 were applied by hand in the dashboard before CI existed,
# so the remote migration history table doesn't know about them. This job marks
# them as already-applied, so the deploy workflow's `supabase db push` won't try
# to re-run them (which would fail).
#
# `migration repair --status applied` only writes to the migration history
# table — it does NOT execute any of the migration SQL. Safe to re-run.
#
# After it succeeds once, you can delete this file.

on:
  workflow_dispatch:

# Share the deploy workflow's lock so a baseline and a push can't race.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Link the project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Mark existing migrations as applied
        run: |
          supabase migration repair --status applied \
            0001 0002 0003 0004 0005 0006 0007 0008 0009

      - name: Show migration history
        run: supabase migration list
